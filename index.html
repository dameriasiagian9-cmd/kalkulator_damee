
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dame Ria Siagian | QuantumCalc</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="browser">

        <!-- BROWSER HEADER -->
        <header class="browser-header">
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="tab">
                ◉ QuantumCalc - Web Application
            </div>

            <div class="browser-address">
                🔒 dame-ria-calculator.com
            </div>
        </header>

        <!-- CALCULATOR -->
        <section class="calculator">

            <div class="identity">
                <div class="logo">DR</div>

                <div>
                    <h2>DAME RIA <span>SIAGIAN</span></h2>
                    <p>QUANTUM CALCULATOR</p>
                </div>

                <div class="online">
                    <span></span> ONLINE
                </div>
            </div>

            <!-- DISPLAY -->
            <div class="display">

                <div class="expression" id="expression">
                    Ready to calculate
                </div>

                <div class="result" id="result">
                    0
                </div>

            </div>

            <!-- BUTTONS -->
            <div class="buttons">

                <button class="cyan" data-action="clear">AC</button>
                <button class="blue" data-action="memory">Mn</button>
                <button class="blue" data-action="power">xⁿ</button>
                <button class="purple" data-action="percent">%</button>
                <button class="purple" data-action="pi">π²</button>
                <button class="orange" data-action="clear-entry">CE</button>

                <button class="cyan" data-number="7">7</button>
                <button class="blue" data-number="8">8</button>
                <button class="blue" data-number="9">9</button>
                <button class="purple" data-operator="/">/</button>
                <button class="purple" data-operator="/">÷</button>
                <button class="orange" data-action="percent">%</button>

                <button class="cyan" data-number="4">4</button>
                <button class="blue" data-number="5">5</button>
                <button class="blue" data-number="6">6</button>
                <button class="purple" data-operator="*">×</button>
                <button class="purple" data-operator="-">−</button>
                <button class="orange" data-action="memory-add">M+</button>

                <button class="cyan" data-number="1">1</button>
                <button class="blue" data-number="2">2</button>
                <button class="blue" data-number="3">3</button>
                <button class="purple" data-operator="-">−</button>

                <button class="orange tall" data-operator="+">+</button>
                <button class="orange tall equals" data-action="equals">=</button>

                <button class="cyan zero" data-number="0">0</button>
                <button class="blue" data-action="decimal">.</button>
                <button class="purple" data-action="backspace">⌫</button>

            </div>

            <!-- FOOTER -->
            <footer>
                <p>✦ DESIGNED BY DAME RIA SIAGIAN ✦</p>
                <span>BLUE NEON CALCULATOR © 2026</span>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
